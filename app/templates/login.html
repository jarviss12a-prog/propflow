{% extends "_auth.html" %}{% from "_macros.html" import csrf %}
{% block title %}Sign in{% endblock %}
{% block auth %}
<form method="post" class="sheet">
  {{ csrf() }}
  <h1>PropFlow</h1>
  <p class="muted">Your rentals, rent and expenses.</p>
  <div class="field">
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
  </div>
  <div class="field"><button class="btn primary" type="submit" style="width:100%">Sign in</button></div>
</form>
{% endblock %}
