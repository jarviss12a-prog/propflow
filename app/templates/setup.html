{% extends "_auth.html" %}{% from "_macros.html" import csrf %}
{% block title %}Set your password{% endblock %}
{% block auth %}
<form method="post" class="sheet">
  {{ csrf() }}
  <h1>Set your password</h1>
  <p class="muted">You'll use this to sign in from your phone and computer. At least 8 characters.</p>
  <div class="field"><label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="new-password" minlength="8" required autofocus></div>
  <div class="field"><label for="pw2">Type it again</label>
    <input id="pw2" name="confirm" type="password" autocomplete="new-password" minlength="8" required></div>
  <div class="field"><button class="btn primary" type="submit" style="width:100%">Save password</button></div>
</form>
{% endblock %}
