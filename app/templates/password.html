{% extends "base.html" %}{% from "_macros.html" import csrf %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="page-head"><h1>Change password</h1></div>
<form method="post" class="form"><div class="sheet">
  {{ csrf() }}
  <div class="field"><label for="cur">Current password</label><input id="cur" name="current" type="password" autocomplete="current-password" required></div>
  <div class="field"><label for="pw">New password</label><input id="pw" name="password" type="password" autocomplete="new-password" minlength="8" required></div>
  <div class="field"><label for="pw2">New password again</label><input id="pw2" name="confirm" type="password" autocomplete="new-password" minlength="8" required></div>
  <div class="field"><button class="btn primary" type="submit">Change password</button></div>
</div></form>
{% endblock %}
