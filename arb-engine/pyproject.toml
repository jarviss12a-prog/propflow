[project]
name = "arb-engine"
version = "0.1.0"
description = "Cross-venue sports arbitrage scanner (Kalshi, Polymarket, sportsbooks)"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
arb = "arb.cli:main"

[tool.setuptools.packages.find]
include = ["arb*"]
